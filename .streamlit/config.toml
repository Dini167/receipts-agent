[server]
maxUploadSize = 10
# do not watch the project files for changes: on Windows this can slow the site down.
# After changing the code, stop with Ctrl+C and run again.
fileWatcherType = "none"
runOnSave = false

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#E6EFEC"
textColor = "#1F2937"
font = "sans serif"
